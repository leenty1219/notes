# flypy.custom.yaml
# 小鶴音形方案的個別補丁。
# 因為 flypy.schema.yaml 裡自帶 menu.page_size: 5，
# 會覆蓋全域設定，所以要在這裡單獨覆寫為 8。
#
# 生效方式：選單「鼠鬚管 → 重新部署」，或執行
#   "/Library/Input Methods/Squirrel.app/Contents/MacOS/Squirrel" --reload

patch:
  menu/page_size: 8


  # ── 官方 rime-emoji 表情建議（現成方案，非自寫）────────
  # 來源：https://github.com/rime/rime-emoji
  switches/@next:
    name: emoji_suggestion
    reset: 1
    states: [ "🈚︎", "🈶️" ]
  "engine/filters/@before 0": simplifier@emoji_suggestion
  emoji_suggestion:
    opencc_config: emoji.json
    option_name: emoji_suggestion
    tips: none
    inherit_comment: false

  # ── 符號面板（V + 代碼）────────────────────────────
  # 參考 Apple 符號視窗：Vhelp 列出分類，Vjt 箭頭、Vsx 數學…
  # punctuator 的 full_shape/half_shape 由 symbols_v.yaml 繼承 default，
  # 再套用 punctuation.custom.yaml 的「直接上屏」。
  punctuator/import_preset: symbols_v
  recognizer/patterns/punct: "^V([0-9]0?|[A-Za-z]+)$"
