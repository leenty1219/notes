# punctuation.custom.yaml
# 標點鍵位（來源：系統 SharedSupport/punctuation.yaml）。
#
# 目標：參考 Apple 原生輸入法——按標點鍵「直接上屏」一個字元，
# 不再先彈出 2~5 個候選讓人再選一次。
#
# 做法：把 punctuation.yaml 的 half_shape / full_shape 表，
# 從「候選清單」改成單一字串；引號保留成對切換。
#
# 保留的選擇：
# - `?` 鍵輸出「？」（全角問號），與 Apple 中文標點一致；
# - `\` 鍵輸出「、」；
# - `,` / `.` 輸出「，」/「。」；
# - 中文模式 `[` / `]` 輸出「【」/「】」；
# - 英文模式（ascii_mode / ascii_punct）由 lua/ascii_brackets.lua
#   輸出「［」/「］」；
# - 全角模式下 `$` 輸出「￥」，`^` 輸出「……」。
#
# 註：librime 的 patch 路徑以 `/` 分隔且無法轉義，直接寫
# half_shape/'/' 會被切成空鍵。因此用 `__merge` 字面量補丁，
# 讓 merge_tree 以「字面鍵名」寫入 `/`。
#
# 生效方式：選單「鼠鬚管 → 重新部署」，或執行
#   "/Library/Input Methods/Squirrel.app/Contents/MacOS/Squirrel" --reload

patch:
  __merge:
    half_shape:
      ' ' : ' '
      ',' : '，'
      '.' : '。'
      '<' : '《'
      '>' : '》'
      '/' : '/'
      '?' : '？'
      ';' : '；'
      ':' : '：'
      '''' : { pair: [ '‘', '’' ] }
      '"' : { pair: [ '“', '”' ] }
      '\' : '、'
      '|' : '·'
      '`' : '`'
      '~' : '~'
      '!' : '！'
      '@' : '@'
      '#' : '#'
      '%' : '%'
      '$' : '￥'
      '^' : '……'
      '&' : '&'
      '*' : '*'
      '(' : '（'
      ')' : '）'
      '-' : '-'
      '_' : '——'
      '+' : '+'
      '=' : '='
      '[' : '【'
      ']' : '】'
      '{' : '『'
      '}' : '』'
    full_shape:
      ' ' : '　'
      ',' : '，'
      '.' : '。'
      '<' : '《'
      '>' : '》'
      '/' : '／'
      '?' : '？'
      ';' : '；'
      ':' : '：'
      '''' : { pair: [ '‘', '’' ] }
      '"' : { pair: [ '“', '”' ] }
      '\' : '、'
      '|' : '·'
      '`' : '｀'
      '~' : '～'
      '!' : '！'
      '@' : '＠'
      '#' : '＃'
      '%' : '％'
      '$' : '￥'
      '^' : '……'
      '&' : '＆'
      '*' : '＊'
      '(' : '（'
      ')' : '）'
      '-' : '－'
      '_' : '——'
      '+' : '＋'
      '=' : '＝'
      '[' : '【'
      ']' : '】'
      '{' : '『'
      '}' : '』'
