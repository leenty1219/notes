# squirrel.custom.yaml
# 鼠鬚管外觀定製：盡量對齊 macOS 系統內建輸入法的 UI 風格
#
# 注意：這裡所有鍵都必須「顯式寫出」。實測發現 build/squirrel.yaml
#       若是缺少某鍵，Squirrel 並不會回落到 SharedSupport/squirrel.yaml
#       的同名默認值，導致 UI 變動。故不再做「去冗餘」精簡。
#
# 生效方式：選單「鼠鬚管 → 重新部署」，或執行
#   "/Library/Input Methods/Squirrel.app/Contents/MacOS/Squirrel" --reload

patch:
  style:
    # ── 配色 ─────────────────────────────────────────────
    color_scheme: native

    # ── 版面 ─────────────────────────────────────────────
    candidate_list_layout: linear
    inline_preedit: true
    inline_candidate: false
    memorize_size: true
    show_paging: false

    # ── 幾何 ─────────────────────────────────────────────
    corner_radius: 10
    hilited_corner_radius: 10
    border_height: 0
    border_width: 0
    shadow_size: 0
    line_spacing: 6
    spacing: 8

    # ── 字型 ─────────────────────────────────────────────
    font_face: "PingFang SC"
    font_point: 16
    label_font_point: 14
    comment_font_point: 14

    # ── 候選項格式 ───────────────────────────────────────
    candidate_format: "[label]. [candidate] [comment]"
